# Catalogue des règles de qualité : source unique de vérité.
# docs/catalogue-regles.md est généré à partir de ce fichier (python pipeline.py catalogue).
#
# seuil       : taux d'échec toléré (0 = aucun échec accepté, 0.01 = 1 %).
#               Pour R01 et R03, les lignes fautives partent en quarantaine ; au-delà de
#               0,1 % le fichier entier est jugé suspect et le run est bloqué.
# criticite   : bloquante (poids 3), majeure (2), mineure (1) dans le score
# statut      : implementee | a_faire

regles:
  - {id: R01, libelle: SIRET renseigné, dimension: Complétude, criticite: bloquante, seuil: 0.001, outil: "GX, à l'entrée", objet: raw.etablissements, statut: implementee}
  - {id: R02, libelle: SIRET unique dans le chargement, dimension: Unicité, criticite: majeure, seuil: 0, outil: "GX, à l'entrée ; règle de survie en staging", objet: raw.etablissements, statut: implementee}
  - {id: R03, libelle: SIRET composé de 14 chiffres, dimension: Validité, criticite: bloquante, seuil: 0.001, outil: "GX, à l'entrée ; lignes en quarantaine", objet: raw.etablissements, statut: implementee}
